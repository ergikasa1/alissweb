<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bar {
      background: #FFD93D;
      padding: 11px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bar span:first-child {
      font-weight: 700;
      font-size: 13px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .bar span:last-child {
      font-size: 12px;
      color: #000;
      opacity: 0.7;
    }

    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .icon {
      width: 56px; height: 56px;
      background: #1a1a1a;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }

    .text { text-align: center; }

    .text h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .text p {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }

    .detected {
      font-size: 12px;
      color: #ff6b6b;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 20px;
      padding: 6px 14px;
    }

    .steps {
      width: 100%;
      background: #1a1a1a;
      border-radius: 14px;
      overflow: hidden;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid #222;
    }

    .step:last-child { border-bottom: none; }

    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #FFD93D;
      color: #000;
      font-weight: 700;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 14px;
      color: #ccc;
      line-height: 1.4;
    }

    .step-text b { color: #fff; }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.8; }

    .btn-main { background: #FFD93D; color: #000; }

    .btn-copy {
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #2a2a2a;
      margin-top: -10px;
    }

    .feedback {
      font-size: 12px;
      color: #4dff91;
      height: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .feedback.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="bar">
    <span>Restricted</span>
    <span>Tap ••• to open</span>
  </div>

  <div class="wrap">
    <div class="icon">🔒</div>

    <div class="text">
      <h1>Open in your browser</h1>
      <p>This in-app browser blocks content.<br>Follow the steps below.</p>
    </div>

    <div class="detected" id="detectedLabel">Detected: In-App Browser</div>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Tap the <b>···</b> icon in the top right corner</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">Select <b>"Open in Browser"</b></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">The page will load instantly ✓</div>
      </div>
    </div>

    <button class="btn btn-main" onclick="tryOpen()">Open in Browser</button>
    <button class="btn btn-copy" onclick="copyLink()">Copy link instead</button>
    <div class="feedback" id="fb">✓ Copied to clipboard</div>
  </div>

  <script>
    (function () {
      
    var T = atob('aHR0cHM6Ly9saW5rdHIuZWUvYWxpc3NrdXNzaWU=');


      var ua = navigator.userAgent || '';

      function detect() {
        if (/Snapchat/i.test(ua))                return 'Snapchat';
        if (/Instagram/i.test(ua))               return 'Instagram';
        if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) return 'Facebook';
        return null;
      }

      var app = detect();

      if (!app) {
        setTimeout(function () { window.location.replace(T); }, 250);
        return;
      }

      document.getElementById('detectedLabel').textContent = 'Detected: ' + app + ' Browser';

      window.tryOpen = function () {
        try { window.open(T, '_system'); } catch (e) {}
        copyLink();
      };

      window.copyLink = function () {
        var fb = document.getElementById('fb');
        function show() {
          fb.classList.add('show');
          setTimeout(function () { fb.classList.remove('show'); }, 2500);
        }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(T).then(show).catch(fallback);
        } else { fallback(); }
        function fallback() {
          var t = document.createElement('textarea');
          t.value = T; t.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(t); t.select();
          try { document.execCommand('copy'); show(); } catch(e){}
          document.body.removeChild(t);
        }
      };
    })();
  </script>

</body>
</html>
